<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Remember - Resultado</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">

    <body>
        <main class="container-resultado">
            <h1 class="titulo">
                <span class="naranja">Co</span>l<span class="rojo">or</span>
                <span class="verde">Re</span>m<span class="magenta">em</span>b<span class="azul">er</span>
            </h1>

            <!-- RESULTADOS -->                
                <!-- PERDER -->
                    <!-- Por falta de tiempo -->
                    <div id="derrota-tiempo" class="container-textoR container-oculto">
                        <p>¡Has perdido!</p>
                        <p>Se te acabó el tiempo</p>
                    </div>

                    <!-- Por pasarse con el uso de las vidas -->
                    <div id="derrota-vidas" class="container-textoR container-oculto">
                        <p>¡Has perdido!</p>
                        <p>Se te han acabado las vidas</p>
                    </div>

                <!-- GANAR -->
                    <!-- Oro -->
                    <div id="victoria-oro" class="container-textoR container-oculto">
                        <p>¡Has ganado!</p>
                        <p>Tu puntuacion:</p>
                        <p>¡Perfecto! 🥇</p>
                    </div>

                    <!-- Plata -->
                    <div id="victoria-plata" class="container-textoR container-oculto">
                        <p>¡Has ganado!</p>
                        <p>Tu puntuacion:</p>
                        <p>¡Muy bien! 🥈</p>
                    </div>

                    <!-- Bronce -->
                    <div id="victoria-bronce" class="container-textoR container-oculto">
                        <p>¡Has ganado!</p>
                        <p>Tu puntuacion:</p>
                        <p>¡Por los pelos! 🥉</p>
                    </div>

                <!-- BOTON DE VUELTA -->
                <div class="container-botonR">

                        <span>Volver</span>

                    <button id="boton-login" type="button" class="boton-result">
                            <span>Inicio</span>
                            <span>
                                <svg class="svg-boton" viewBox="0 0 62 59" fill="none" xmlns="http://www.w3.org/2000/svg">

                </div>
        </main>

        <script type="module" src="../js/main.js"></script>
